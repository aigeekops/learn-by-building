<svg xmlns="http://www.w3.org/2000/svg" width="750" height="940" viewBox="0 0 750 940"><rect width="750" height="940" fill="white"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="52" font-size="34" fill="#202B43" text-anchor="start" font-weight="700">输出约 1.67V，下一步查什么</text><text x="30" y="94" font-size="26" fill="#64748B" text-anchor="start" font-weight="400">每次检查，都要能区分候选原因</text><rect x="30" y="125" width="690" height="105" rx="16" fill="#F5F7FF" stroke="#DCE3FC" stroke-width="2"/><text x="60" y="170" font-size="29" fill="#4B6EF5" text-anchor="start" font-weight="700">① 故障出现时，测实际输入电压</text><text x="60" y="210" font-size="25" fill="#64748B" text-anchor="start" font-weight="400">先确认测量位置与共同参考地</text><path d="M375,238 L375,270" fill="none" stroke="#4B6EF5" stroke-width="4" stroke-linecap="round"/><path d="M366,258 L375,270 L384,258" fill="none" stroke="#4B6EF5" stroke-width="4"/><rect x="30" y="284" width="330" height="130" rx="16" fill="#F5F7FF" stroke="#DCE3FC" stroke-width="2"/><rect x="390" y="284" width="330" height="130" rx="16" fill="#F5F7FF" stroke="#DCE3FC" stroke-width="2"/><text x="195" y="332" font-size="30" fill="#B45309" text-anchor="middle" font-weight="700">输入约 3.33V</text><text x="195" y="380" font-size="27" fill="#202B43" text-anchor="middle" font-weight="400">继续检查输入端</text><text x="555" y="332" font-size="30" fill="#4B6EF5" text-anchor="middle" font-weight="700">输入约 5V</text><text x="555" y="380" font-size="26" fill="#202B43" text-anchor="middle" font-weight="400">继续区分负载与阻值</text><path d="M555,422 L555,458" fill="none" stroke="#4B6EF5" stroke-width="4" stroke-linecap="round"/><path d="M546,446 L555,458 L564,446" fill="none" stroke="#4B6EF5" stroke-width="4"/><text x="375" y="500" font-size="26" fill="#64748B" text-anchor="middle" font-weight="400">以下只继续检查输入约 5V 的分支</text><rect x="30" y="526" width="690" height="125" rx="16" fill="#F5F7FF" stroke="#DCE3FC" stroke-width="2"/><text x="60" y="570" font-size="29" fill="#4B6EF5" text-anchor="start" font-weight="700">② 在仿真中移除额外负载</text><text x="60" y="615" font-size="26" fill="#64748B" text-anchor="start" font-weight="400">保持输入、原有电阻与接线不变</text><path d="M375,659 L375,690" fill="none" stroke="#4B6EF5" stroke-width="4" stroke-linecap="round"/><path d="M366,678 L375,690 L384,678" fill="none" stroke="#4B6EF5" stroke-width="4"/><rect x="30" y="705" width="330" height="145" rx="16" fill="#F5F7FF" stroke="#DCE3FC" stroke-width="2"/><rect x="390" y="705" width="330" height="145" rx="16" fill="#F5F7FF" stroke="#DCE3FC" stroke-width="2"/><text x="195" y="750" font-size="30" fill="#4B6EF5" text-anchor="middle" font-weight="700">恢复约 2.50V</text><text x="195" y="795" font-size="26" fill="#202B43" text-anchor="middle" font-weight="400">支持负载影响的解释</text><text x="555" y="750" font-size="30" fill="#B45309" text-anchor="middle" font-weight="700">仍约 1.67V</text><text x="555" y="795" font-size="26" fill="#202B43" text-anchor="middle" font-weight="400">继续核对阻值与连接</text><text x="375" y="905" font-size="24" fill="#64748B" text-anchor="middle" font-weight="400">仅比较文中的三个候选原因；不符时扩大检查范围</text></g></svg>