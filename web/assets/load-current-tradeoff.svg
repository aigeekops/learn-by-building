<svg xmlns="http://www.w3.org/2000/svg" width="750" height="880" viewBox="0 0 750 880"><rect width="750" height="880" fill="white"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="52" font-size="34" fill="#202B43" text-anchor="start" font-weight="700">降低电阻，改善输出也增加耗电</text><text x="30" y="94" font-size="25" fill="#64748B" text-anchor="start" font-weight="400">输入同为 5V · 负载同为 10kΩ · 分压比例相同</text><rect x="24" y="120" width="340" height="540" rx="16" fill="#F5F7FF" stroke="#DCE3FC" stroke-width="2"/><rect x="386" y="120" width="340" height="540" rx="16" fill="#F5F7FF" stroke="#DCE3FC" stroke-width="2"/><text x="194" y="169" font-size="28" fill="#4B6EF5" text-anchor="middle" font-weight="700">R1 = R2 = 10kΩ</text><text x="556" y="169" font-size="28" fill="#B45309" text-anchor="middle" font-weight="700">R1 = R2 = 100Ω</text><text x="194" y="222" font-size="25" fill="#64748B" text-anchor="middle" font-weight="400">空载输出均为 2.50V</text><text x="194" y="287" font-size="26" fill="#202B43" text-anchor="middle" font-weight="400">接上负载后的输出</text><text x="194" y="346" font-size="43" fill="#4B6EF5" text-anchor="middle" font-weight="700">约 1.67V</text><text x="194" y="410" font-size="26" fill="#64748B" text-anchor="middle" font-weight="400">等效输出电阻</text><text x="194" y="454" font-size="35" fill="#202B43" text-anchor="middle" font-weight="700">5kΩ</text><text x="194" y="520" font-size="26" fill="#64748B" text-anchor="middle" font-weight="400">空载支路电流</text><text x="194" y="573" font-size="39" fill="#202B43" text-anchor="middle" font-weight="700">0.25mA</text><text x="556" y="222" font-size="25" fill="#64748B" text-anchor="middle" font-weight="400">空载输出均为 2.50V</text><text x="556" y="287" font-size="26" fill="#202B43" text-anchor="middle" font-weight="400">接上负载后的输出</text><text x="556" y="346" font-size="43" fill="#B45309" text-anchor="middle" font-weight="700">约 2.49V</text><text x="556" y="410" font-size="26" fill="#64748B" text-anchor="middle" font-weight="400">等效输出电阻</text><text x="556" y="454" font-size="35" fill="#202B43" text-anchor="middle" font-weight="700">50Ω</text><text x="556" y="520" font-size="26" fill="#64748B" text-anchor="middle" font-weight="400">空载支路电流</text><text x="556" y="573" font-size="39" fill="#202B43" text-anchor="middle" font-weight="700">25mA</text><rect x="30" y="689" width="690" height="108" rx="16" fill="#FFF8ED" stroke="#F5D7A7" stroke-width="2"/><text x="375" y="733" font-size="29" fill="#B45309" text-anchor="middle" font-weight="700">输出更接近 2.50V</text><text x="375" y="775" font-size="29" fill="#B45309" text-anchor="middle" font-weight="700">空载支路电流增加 100 倍</text><text x="375" y="846" font-size="24" fill="#64748B" text-anchor="middle" font-weight="400">理想模型计算；负载输出与空载电流为不同工况</text></g></svg>